name: Build External Tipa
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang xz-utils zip unzip libplist-dev libssl-dev libxml2-dev
          
          # Compila o ldid
          git clone https://github.com/ProcursusTeam/ldid.git
          cd ldid
          make
          sudo cp ./ldid /usr/local/bin/
          cd ..
          
          # Configura o Theos
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # Baixa os SDKs do iOS
          mkdir -p $THEOS/sdks
          curl -L -o $THEOS/sdks/master.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q $THEOS/sdks/master.zip -d $THEOS/sdks/
          mv $THEOS/sdks/sdks-master/* $THEOS/sdks/
          rm -rf $THEOS/sdks/sdks-master $THEOS/sdks/master.zip

          # A MÁGICA: Engana o Theos linkando o clang do sistema
          mkdir -p $THEOS/toolchain/linux/iphone/bin
          ln -sf /usr/bin/clang $THEOS/toolchain/linux/iphone/bin/clang
          ln -sf /usr/bin/clang++ $THEOS/toolchain/linux/iphone/bin/clang++
          ln -sf /usr/bin/ld $THEOS/toolchain/linux/iphone/bin/ld
          ln -sf /usr/bin/ar $THEOS/toolchain/linux/iphone/bin/ar

      - name: Build and Stage App
        run: |
          cd FFExternal
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make stage

      - name: Package as Tipa
        run: |
          cd FFExternal
          mkdir -p Payload
          cp -r .theos/_/Applications/FFExternal.app Payload/
          cp Info.plist Payload/FFExternal.app/Info.plist
          
          ldid -SEntitlements.plist Payload/FFExternal.app/FFExternal
          
          if ! ldid -e Payload/FFExternal.app/FFExternal | grep -q "task_for_pid-allow"; then
              echo "ERRO FATAL: Falta a permissao task_for_pid-allow!"
              exit 1
          fi
          
          zip -qry FFExternal.tipa Payload

      - name: Upload Tipa
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-Tipa
          path: FFExternal/FFExternal.tipa
