name: Build External Tipa
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang xz-utils zip unzip libplist-dev libssl-dev libxml2-dev libncurses5

      - name: Setup Theos & SDKs
        run: |
          THEOS_DIR="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS_DIR" >> $GITHUB_ENV

          # 1. Theos
          git clone --recursive https://github.com/theos/theos.git $THEOS_DIR

          # 2. SDKs
          mkdir -p $THEOS_DIR/sdks
          curl -L -o /tmp/sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mv /tmp/sdks/sdks-master/*.sdk $THEOS_DIR/sdks/

          # 3. Toolchain Apple
          curl -sL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz -o /tmp/swift.tar.xz
          tar -xf /tmp/swift.tar.xz -C $THEOS_DIR/toolchain/

          # 4. Symlinks do clang
          mkdir -p $THEOS_DIR/toolchain/linux/iphone/bin
          ln -sf /usr/bin/clang   $THEOS_DIR/toolchain/linux/iphone/bin/clang
          ln -sf /usr/bin/clang++ $THEOS_DIR/toolchain/linux/iphone/bin/clang++
          ln -sf /usr/bin/ar      $THEOS_DIR/toolchain/linux/iphone/bin/ar

          # 5. CRIA o header que falta
          cat > $THEOS_DIR/toolchain/linux/iphone/lib/swift/clang/include/__stddef_max_align_t.h << 'EOF'
          #ifndef __STDDEF_MAX_ALIGN_T_H
          #define __STDDEF_MAX_ALIGN_T_H
          #include <stddef.h>
          typedef long double max_align_t;
          #endif
          EOF

      - name: Compile ldid
        run: |
          git clone https://github.com/ProcursusTeam/ldid.git
          cd ldid
          make
          sudo cp ./ldid /usr/local/bin/
          cd ..

      - name: Build and Stage App
        run: |
          cd FFExternal
          export PATH=$THEOS/bin:$PATH
          make stage

      - name: Package as Tipa
        run: |
          cd FFExternal
          mkdir -p Payload
          cp -r .theos/_/Applications/FFExternal.app Payload/
          cp Info.plist Payload/FFExternal.app/Info.plist
          
          ldid -SEntitlements.plist Payload/FFExternal.app/FFExternal
          
          if ! ldid -e Payload/FFExternal.app/FFExternal | grep -q "task_for_pid-allow"; then
              echo "ERRO FATAL: Falta a permissao task_for_pid-allow!"
              exit 1
          fi
          
          zip -qry FFExternal.tipa Payload

      - name: Upload Tipa
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-Tipa
          path: FFExternal/FFExternal.tipa
